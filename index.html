<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>密钥验证</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        input, button { padding: 8px; margin: 5px 0; width: 300px; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>密钥验证页面</h2>
    <label>站点密钥:</label><br>
    <input type="text" id="siteKey" placeholder="请输入站点密钥"><br>

    <label>密钥:</label><br>
    <input type="text" id="userKey" placeholder="请输入密钥"><br>

    <button onclick="verifyKeys()">验证</button>

    <div id="result"></div>

    <script>
        // 预设密钥
        const VALID_SITE_KEY = "0x4AAAAAADN7DzAkeSbxN7Dc";
        const VALID_KEY = "0x4AAAAAADN7DxxqmuPMto4Hm3Uw5cRh_Bg";

        function verifyKeys() {
            const siteKey = document.getElementById("siteKey").value.trim();
            const userKey = document.getElementById("userKey").value.trim();
            const resultDiv = document.getElementById("result");

            if (siteKey === VALID_SITE_KEY && userKey === VALID_KEY) {
                resultDiv.style.color = "green";
                resultDiv.textContent = "验证成功 ✅";
            } else {
                resultDiv.style.color = "red";
                resultDiv.textContent = "验证失败 ❌";
            }
        }
    </script>
</body>
</html>
